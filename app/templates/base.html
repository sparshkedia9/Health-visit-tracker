<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} · Visit Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Health Visit Tracker</a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
      <a href="/households" class="{{ 'active' if active == 'households' }}">Households</a>
      <a href="/visits" class="{{ 'active' if active == 'visits' }}">Visits</a>
      <a href="/reports" class="{{ 'active' if active == 'reports' }}">Reports</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
