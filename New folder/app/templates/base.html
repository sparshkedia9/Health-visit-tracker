<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} · Visit Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script>
    // If the sidebar was collapsed on the last page, collapse it again straight away
    // (this runs before the page is drawn, so the sidebar doesn't "jump").
    try {
      if (localStorage.getItem("sidebarCollapsed") === "yes") {
        document.documentElement.classList.add("sidebar-collapsed");
      }
    } catch (error) {}
  </script>
</head>
<body>
  <!-- ===== Sidebar navigation (shared by every page) ===== -->
  <aside class="sidebar">
    <a class="sidebar-brand" href="/">
      <span class="brand-icon"><i data-lucide="heart-pulse" class="icon"></i></span>
      <span class="nav-label">Health Visit Tracker</span>
    </a>

    <nav class="sidebar-nav">
      <!-- data-tooltip is the text shown when the sidebar is collapsed -->
      <a href="/" class="nav-link {{ 'active' if active == 'dashboard' }}" data-tooltip="Dashboard" aria-label="Dashboard">
        <i data-lucide="layout-dashboard" class="icon"></i>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="/households" class="nav-link {{ 'active' if active == 'households' }}" data-tooltip="Households" aria-label="Households">
        <i data-lucide="users" class="icon"></i>
        <span class="nav-label">Households</span>
      </a>
      <a href="/visits" class="nav-link {{ 'active' if active == 'visits' }}" data-tooltip="Visits" aria-label="Visits">
        <i data-lucide="calendar-check" class="icon"></i>
        <span class="nav-label">Visits</span>
      </a>
      <a href="/reports" class="nav-link {{ 'active' if active == 'reports' }}" data-tooltip="Reports" aria-label="Reports">
        <i data-lucide="file-text" class="icon"></i>
        <span class="nav-label">Reports</span>
      </a>
    </nav>

    <!-- Collapse / expand button. Only one of the two icons is visible at a time (see style.css). -->
    <button type="button" id="sidebar-toggle" class="sidebar-toggle" data-tooltip="Expand menu" aria-label="Collapse or expand menu">
      <i data-lucide="panel-left-close" class="icon icon-collapse"></i>
      <i data-lucide="panel-left-open" class="icon icon-expand"></i>
      <span class="nav-label">Collapse menu</span>
    </button>
  </aside>

  <!-- ===== Page content ===== -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', path='vendor/lucide.min.js') }}"></script>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
